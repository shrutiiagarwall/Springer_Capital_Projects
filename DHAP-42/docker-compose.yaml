# docker-compose.yaml
# DHAP-42 — CSV → MinIO Parquet Ingestion Pipeline
#
# Services
# --------
#   postgres-meta       — PostgreSQL used exclusively by Airflow as its
#                         metadata DB. Do NOT point your DAG at this DB.
#   minio               — S3-compatible object store (API :9020, UI :9021).
#   mc-init             — One-shot MinIO Client container that creates the
#                         target bucket on startup (idempotent).
#   airflow-init        — One-shot init: db migrate, admin user, no extra
#                         connections needed (MinIO conn is via env var).
#   airflow-webserver   — Airflow web UI (http://localhost:8082)
#   airflow-scheduler   — LocalExecutor scheduler (no Celery/Redis needed)
#
# Volume mounts
# -------------
#   ./dags      → /opt/airflow/dags        (DAG + sample.csv)
#   ./config    → /opt/airflow/config      (schema_contract.yaml)
#   ./tests     → /opt/airflow/tests       (negative test fixtures)
#
# Port mapping (avoids DHAP-34 conflicts)
# ----------------------------------------
#   DHAP-34  →  Airflow :8080,  Postgres target :5433
#   DHAP-42  →  Airflow :8082,  MinIO API :9020,  MinIO console :9021
#
# Quick start
# -----------
#   cp .env.example .env        # review defaults (they work out of the box)
#   docker compose up -d        # build image + start all services
#   # Airflow UI   → http://localhost:8082  (admin / admin)
#   # MinIO console → http://localhost:9021  (minioadmin / minioadmin123)
#
# All secrets are read from the .env file. Never commit a populated .env.

# ---------------------------------------------------------------------------
# Shared Airflow configuration (YAML anchor)
# ---------------------------------------------------------------------------
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ""

    # Metadata DB connection (Airflow internal)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-meta:5432/airflow_meta

    # Webserver secret key
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-changeme_replace_in_dotenv}

    # ---------------------------------------------------------------------------
    # MinIO / S3 Connection injected as env var — no UI clicking required.
    # Format: aws://<key>:<secret>@/?endpoint_url=<url-encoded-endpoint>
    # The endpoint 'http://minio:9000' uses the Docker-internal service name.
    # ---------------------------------------------------------------------------
    AIRFLOW_CONN_MINIO_S3: ${AIRFLOW_CONN_MINIO_S3}

    # Expose config paths so DAG tasks can read them without hardcoding
    MAILEX_CONTRACT_PATH: /opt/airflow/config/schema_contract.yaml
    MAILEX_CSV_PATH: /opt/airflow/dags/extraction/sample.csv
    MINIO_BUCKET: ${MINIO_BUCKET:-mailex-parquet}

    # Pass UID through so file ownership in volumes is correct
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}

  volumes:
    - ./dags:/opt/airflow/dags
    - ./config:/opt/airflow/config
    - ./tests:/opt/airflow/tests
    - airflow_logs:/opt/airflow/logs

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    postgres-meta:
      condition: service_healthy

services:
  # --------------------------------------------------------------------------
  # postgres-meta: Airflow internal metadata database (not exposed to host)
  # --------------------------------------------------------------------------
  postgres-meta:
    image: postgres:15
    container_name: dhap42_postgres_meta
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow_meta
    volumes:
      - pg_meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d airflow_meta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # minio: Real MinIO object store, built from Dockerfile.minio.
  # The binary is downloaded from GitHub Releases (avoids Docker Hub org-image
  # pull restrictions in this environment — only official/library images work).
  #
  # API      → http://localhost:${MINIO_API_PORT:-9020}  (S3-compatible)
  # Console  → http://localhost:${MINIO_CONSOLE_PORT:-9021}  (web UI)
  #            Login: MINIO_ROOT_USER / MINIO_ROOT_PASSWORD from .env
  # --------------------------------------------------------------------------
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    container_name: dhap42_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address :9001
    ports:
      - "${MINIO_API_PORT:-9020}:9000"
      - "${MINIO_CONSOLE_PORT:-9021}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # mc-init: Creates the S3 bucket via boto3 (idempotent).
  # Works with both moto server and real MinIO — same S3 API.
  # --------------------------------------------------------------------------
  mc-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhap42_mc_init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-mailex-parquet}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "=== [mc-init] Creating S3 bucket via boto3 ==="
        python3 - <<'PYEOF'
        import os, time, sys
        import boto3
        from botocore.exceptions import ClientError, EndpointConnectionError

        endpoint = "http://minio:9000"
        user     = os.environ["MINIO_ROOT_USER"]
        password = os.environ["MINIO_ROOT_PASSWORD"]
        bucket   = os.environ["MINIO_BUCKET"]

        s3 = boto3.client(
            "s3",
            endpoint_url=endpoint,
            aws_access_key_id=user,
            aws_secret_access_key=password,
            region_name="us-east-1",
        )

        print(f"Waiting for S3 server at {endpoint}...")
        for attempt in range(30):
            try:
                s3.list_buckets()
                print("S3 server is ready.")
                break
            except Exception as e:
                print(f"  Attempt {attempt+1}/30: {e}. Retrying in 5s...")
                time.sleep(5)
        else:
            print("S3 server did not become ready in time.", file=sys.stderr)
            sys.exit(1)

        try:
            s3.create_bucket(Bucket=bucket)
            print(f"Bucket '{bucket}' created.")
        except ClientError as e:
            code = e.response["Error"]["Code"]
            if code in ("BucketAlreadyOwnedByYou", "BucketAlreadyExists"):
                print(f"Bucket '{bucket}' already exists — OK.")
            else:
                print(f"Error: {e}", file=sys.stderr)
                sys.exit(1)

        resp = s3.list_buckets()
        print("Buckets:", [b["Name"] for b in resp.get("Buckets", [])])
        print("=== [mc-init] Done. ===")
        PYEOF
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # --------------------------------------------------------------------------
  # airflow-init: One-shot initialisation.
  # Runs db migrate and creates the admin user.
  # The MinIO S3 connection is already available via AIRFLOW_CONN_MINIO_S3.
  # --------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: dhap42_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e

        echo "=== [airflow-init] Running Airflow DB migrations ==="
        airflow db migrate

        echo "=== [airflow-init] Creating admin user ==="
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          || echo "Admin user already exists, skipping."

        echo "=== [airflow-init] Done. MinIO connection available via env var AIRFLOW_CONN_MINIO_S3 ==="

    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres-meta:
        condition: service_healthy
    restart: "no"

  # --------------------------------------------------------------------------
  # airflow-webserver: Airflow UI on http://localhost:8082
  # --------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: dhap42_airflow_webserver
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # airflow-scheduler: LocalExecutor scheduler (no Celery/Redis)
  # --------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: dhap42_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$(hostname)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_meta_data:
  airflow_logs:
  minio_data:    # Persistent MinIO data — Parquet files survive container restarts
